<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VigyanSetu mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>VigyanSetu mark</title>
  
  <g transform="translate(0 6)"><g id="mark">
    <!-- fragmented deck (data) becoming a solid deck (verified knowledge) -->
    <rect x="4" y="46" width="7" height="5" rx="2.5" fill="#12264A"/>
    <rect x="14" y="46" width="7" height="5" rx="2.5" fill="#12264A"/>
    <rect x="24" y="46" width="7" height="5" rx="2.5" fill="#12264A"/>
    <rect x="34" y="46" width="26" height="5" rx="2.5" fill="#12264A"/>
    <!-- arch -->
    <path d="M8 46 A24 19 0 0 1 56 46" fill="none" stroke="#12264A" stroke-width="4.5" stroke-linecap="round"/>
    <!-- hangers -->
    <line x1="20" y1="29.5" x2="20" y2="46" stroke="#0E7C86" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="32" y1="27" x2="32" y2="46" stroke="#0E7C86" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="44" y1="29.5" x2="44" y2="46" stroke="#0E7C86" stroke-width="2.4" stroke-linecap="round"/>
